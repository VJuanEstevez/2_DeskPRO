<!doctype html>
<html lang="es" data-theme="dark">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark light" />
  <meta name="description"
    content="DeskPRO, dashboard de productividad: calendario, pomodoro, clima, tareas, notas, reproductor, favoritos y generador de contraseñas." />
  <title>DeskPRO · Dashboard de productividad</title>
  <link rel="icon" type="image/svg+xml" href="./assets/logo/favicon.svg" />
  <script>
    // Aplica el tema guardado antes del primer pintado para evitar parpadeos.
    try {
      var stored = JSON.parse(localStorage.getItem('deskpro:v1:settings') || '{}');
      var preference = stored.theme || 'system';
      var resolved =
        preference === 'system'
          ? window.matchMedia('(prefers-color-scheme: light)').matches
            ? 'light'
            : 'dark'
          : preference;
      document.documentElement.dataset.theme = resolved;
      document.documentElement.style.colorScheme = resolved;
    } catch (error) {
      document.documentElement.dataset.theme = 'dark';
    }
  </script>
</head>

<body>
  <a class="skip-link" href="#view">Saltar al contenido principal</a>

  <header class="app-header">
    <div class="app-header__start">
      <a class="brand" href="#/">
        <svg class="brand__mark" viewBox="0 0 32 32" width="32" height="32" aria-hidden="true" focusable="false">
          <defs>
            <linearGradient id="brand-gradient" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#3d8bff" />
              <stop offset="100%" stop-color="#7c5cff" />
            </linearGradient>
          </defs>
          <rect x="0" y="0" width="32" height="32" rx="9" fill="url(#brand-gradient)" />
          <path fill-rule="evenodd"
            d="M10.5 8.5h4.8a7.25 7.25 0 0 1 0 14.5h-4.8zm3.4 3.3v7.9h1.4a3.95 3.95 0 0 0 0-7.9z" fill="#ffffff" />
        </svg>
        <span class="brand__name">DeskPRO</span>
      </a>
      <p class="app-header__greeting" id="header-greeting">Hola</p>
    </div>

    <div class="app-header__meta">
      <div class="app-header__clock">
        <time class="app-header__time" id="header-time">--:--:--</time>
        <span class="app-header__date" id="header-date">&nbsp;</span>
      </div>
    </div>
  </header>

  <nav class="side-nav" aria-label="Aplicaciones">
    <ul class="side-nav__list" id="nav-apps"></ul>
    <ul class="side-nav__list side-nav__list--footer">
      <li>
        <button class="side-nav__link side-nav__link--button" id="settings-toggle" type="button">
          <svg class="icon side-nav__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <use href="#icon-settings"></use>
          </svg>
          <span class="side-nav__label">Ajustes</span>
        </button>
      </li>
    </ul>
  </nav>

  <main class="view" id="view" tabindex="-1"></main>

  <p class="app-location">
    <svg class="icon" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false">
      <use href="#icon-pin"></use>
    </svg>
    <span id="header-place">Buscando ubicación…</span>
  </p>

  <dialog class="settings" id="settings-dialog" aria-labelledby="settings-title">
    <form class="settings__form" id="settings-form" method="dialog">
      <div class="settings__header">
        <h2 class="settings__title" id="settings-title">Ajustes del dashboard</h2>
        <button class="icon-button" type="button" id="settings-close" aria-label="Cerrar ajustes">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <use href="#icon-close"></use>
          </svg>
        </button>
      </div>

      <div class="settings__body">
        <fieldset class="settings__fieldset">
          <legend class="settings__legend">Apariencia</legend>

          <label class="field">
            <span class="field__label">Tu nombre (para el saludo)</span>
            <input class="field__control" type="text" id="setting-name" name="name" maxlength="30"
              placeholder="Ej. Juan" autocomplete="given-name" />
          </label>

          <label class="field">
            <span class="field__label">Tema</span>
            <select class="field__control" id="setting-theme" name="theme">
              <option value="system">Según el sistema</option>
              <option value="dark">Oscuro</option>
              <option value="light">Claro</option>
            </select>
          </label>
        </fieldset>

        <fieldset class="settings__fieldset">
          <legend class="settings__legend">Clima</legend>

          <label class="field">
            <span class="field__label">Ciudad por defecto</span>
            <input class="field__control" type="text" id="setting-city" name="city" list="city-options"
              placeholder="Ej. Madrid" autocomplete="off" />
            <datalist id="city-options"></datalist>
          </label>
          <p class="field__hint" id="setting-city-hint">Se usa si el navegador no comparte tu ubicación.</p>
        </fieldset>

        <fieldset class="settings__fieldset">
          <legend class="settings__legend">Aplicaciones del panel</legend>
          <p class="field__hint">Marca las que quieras ver y reordénalas con las flechas.</p>
          <ul class="settings__apps" id="settings-apps"></ul>
        </fieldset>
      </div>

      <div class="settings__footer">
        <button class="button button--ghost" type="button" id="settings-cancel">Cancelar</button>
        <button class="button button--primary" type="submit" value="save">Guardar cambios</button>
      </div>
    </form>
  </dialog>

  <div class="toast-region" id="toast-region" role="status"></div>

  <script type="module" src="./main.js"></script>
</body>

</html>
